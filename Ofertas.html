<!DOCTYPE html> 
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ofertas - Junior D'Flores</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: #fdfdfd;
      color: #333;
    }

    /* ====== ENCABEZADO ====== */
    header {
      position: relative;
      background: #fff;
      overflow: visible; 
      height: 180px; 
      display: flex;
      justify-content: center;
      align-items: flex-end;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      padding-bottom: 20px;
    }

    /* ====== CURVA DIFUMINADA ====== */
    .fondo-linea {
      position: absolute;
      top: 0;
      left: 0;          /* Limita el SVG al borde izquierdo */
      width: 100%;      /* No sobresalga del header */
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    .fondo-linea path {
      fill: none;
      stroke: url(#gradCoral);
      stroke-width: 60;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-opacity: 0.9;
    }

    /* ====== TÍTULO Y LOGO ====== */
    .titulo-logo {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .titulo {
      font-family: 'Playfair Display', serif;
      font-size: 4em;
      letter-spacing: 5px;
      color: #222;
      text-transform: uppercase;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.15);
      margin: 0;
    }

    .logo img {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 50%;
    }

    /* ====== MENÚ ====== */
    nav {
      background: #FF9898;
      padding: 12px 0;
      text-align: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    }

    nav a {
      color: #fff;
      margin: 0 20px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1em;
      position: relative;
      transition: 0.3s;
    }

    nav a::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 0%;
      height: 2px;
      background: #FFE8DB;
      transition: width 0.3s;
    }

    nav a:hover {
      color: #FFE8DB;
    }

    nav a:hover::after {
      width: 100%;
    }

    /* ====== SECCIONES ====== */
    section {
      padding: 60px 20px;
      max-width: 1100px;
      margin: auto;
    }

    section h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 2.2em;
      color: #222;
      position: relative;
    }

    section h2::after {
      content: "";
      display: block;
      width: 80px;
      height: 4px;
      background: #FF9898;
      margin: 10px auto 0;
      border-radius: 2px;
    }

    /* ====== PRODUCTOS ====== */
    .productos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      margin-top: 30px;
    }

    .card {
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    }

    .card img {
      max-width: 100%;
      border-radius: 12px;
    }

    .card h3 {
      margin: 15px 0 8px;
      font-size: 1.3em;
      color: #444;
    }

    .card p {
      font-size: 1em;
      color: #666;
    }

    /* ====== BOTÓN REGRESAR ====== */
    .back-btn {
      display: inline-block;
      background: #FF9898;
      color: #fff;
      padding: 12px 25px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      margin: 40px auto 0;
      display: block;
      width: max-content;
      transition: 0.3s;
    }
    .back-btn:hover { background: #d86c6c; }

    /* ====== FOOTER ====== */
    footer {
      background: #FF9898;
      color: #fff;
      text-align: center;
      padding: 40px 20px;
      margin-top: 40px;
    }

    .social-fixed {
      position: fixed;
      right: 20px;
      top: 40%;
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 999;
    }

    .social-fixed a img {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }

    /* ====== RESPONSIVIDAD ====== */
    @media (max-width: 800px) {
      .titulo { font-size: 2.8em; letter-spacing: 2px; }
      .logo img { width: 110px; height: 110px; }
      header { flex-direction: column; gap: 15px; align-items: center; height: auto; padding-bottom: 15px; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <!-- CURVA DIFUMINADA -->
    <svg class="fondo-linea" viewBox="0 0 1600 180" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gradCoral" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#FF9898" stop-opacity="0.1"/>
          <stop offset="15%" stop-color="#FF9898" stop-opacity="0.5"/>
          <stop offset="50%" stop-color="#FF9898" stop-opacity="0.6"/>
          <stop offset="85%" stop-color="#FF9898" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#FF9898" stop-opacity="0.1"/>
        </linearGradient>
      </defs>
      <!-- CURVA ORIGINAL PRESERVADA -->
      <path d="M0,140
               C300,10 600,170 900,90 
               S1300,60 1600,140" />
    </svg>

    <!-- TÍTULO Y LOGO SOBRE LA CURVA -->
    <div class="titulo-logo">
      <h1 class="titulo">Junior D'Flores</h1>
      <div class="logo">
        <img src="logo/logo.png" alt="Logo de la tienda">
      </div>
    </div>
  </header>

  <!-- NAV -->
  <nav>
    <a href="index.html">INICIO</a>
    <a href="mujer.html">MUJER</a>
    <a href="hombre.html">CABALLERO</a>
    <a href="kids.html">KIDS</a>
    <a href="ofertas.html">OFERTAS</a>
  </nav>

  <!-- SECCIÓN PRODUCTOS -->
  <section>
    <h2>Ofertas</h2>
    <div class="productos">
      <div class="card">
        <img src="https://via.placeholder.com/280x350" alt="">
        <h3>Producto 1</h3>
        <p>Descripción del producto</p>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/280x350" alt="">
        <h3>Producto 2</h3>
        <p>Descripción del producto</p>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/280x350" alt="">
        <h3>Producto 3</h3>
        <p>Descripción del producto</p>
      </div>
    </div>
    <a class="back-btn" href="index.html">← Regresar</a>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="social-fixed">
      <a href="https://www.facebook.com/juniordflorescompany" target="_blank">
        <img src="logo/facebook.png" alt="Facebook">
      </a>
      <a href="https://www.tiktok.com/@juniordflores?_t=ZS-8zcmsfaUGH4&_r=1" target="_blank">
        <img src="logo/tik-tok.png" alt="TikTok">
      </a>
      <a href="tel:55 7981 3965">
        <img src="logo/whatsapp (2).png" alt="Teléfono">
      </a>
    </div>
    <p></p>
  </footer>

</body>
</html>
